[project]
name = "pywordle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# pycodestyle errors (layout is left to `ruff format`), pyflakes, isort,
# pyupgrade, bugbear
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
